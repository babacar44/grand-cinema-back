spring:
  application:
    name: grand-cinema-backend
  profiles:
    default: dev                  # sans indication, on est en développement
  jpa:
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Paris
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    expiration-minutes: 120
  reservation:
    blocage-minutes: 10           # US 19

springdoc:
  swagger-ui:
    path: /swagger-ui.html