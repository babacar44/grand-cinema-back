# Intégration continue : à chaque push et Pull Request sur main / develop,
# compilation, tests (unitaires + intégration Testcontainers), couverture JaCoCo
# et analyse de qualité SonarCloud.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet : nécessaire à SonarCloud

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Build, tests, couverture et analyse SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=babacar44_grand-cinema-back

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-jacoco
          path: target/site/jacoco/
